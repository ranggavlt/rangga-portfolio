  <text x="82" y="74" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="-1" fill="#171715">RA</text>
  <text x="112" y="74" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="-0.3" fill="#171715">Rangga Ariansyah</text>

  <!-- Main heading -->
  <text x="64" y="280" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="80" font-weight="500" letter-spacing="-6" fill="#171715">Building</text>
  <text x="64" y="370" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="80" font-weight="500" letter-spacing="-6" fill="#555550">digital things</text>
  <text x="64" y="460" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="80" font-weight="500" letter-spacing="-6" fill="#555550">that matter.</text>

  <!-- Role label -->
  <text x="64" y="540" font-family="monospace" font-size="13" letter-spacing="2" fill="#686861" text-transform="uppercase">FULL-STACK WEB DEVELOPER · JAKARTA, ID</text>

