  <text x="925" y="340" font-family="monospace" font-size="11" fill="#686861" letter-spacing="1">04 — ORGANIZATIONS</text>
  <text x="925" y="380" font-family="monospace" font-size="11" fill="#686861" letter-spacing="1">05 — ABOUT</text>
  <text x="925" y="420" font-family="monospace" font-size="11" fill="#686861" letter-spacing="1">06 — SKILLS</text>
